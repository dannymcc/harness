services:
  harness:
    image: ghcr.io/dannymcc/harness:latest
    build: .
    container_name: harness
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      # Claude account auth: generate once with `claude setup-token`
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # GitHub: a PAT with repo scope (or mount your gh config instead)
      - GH_TOKEN=${GH_TOKEN}
      - HARNESS_MODEL=${HARNESS_MODEL:-claude-opus-5}
      - HARNESS_POLL_INTERVAL_MINUTES=${HARNESS_POLL_INTERVAL_MINUTES:-30}
      - HARNESS_MAX_BUDGET_USD_PER_RUN=${HARNESS_MAX_BUDGET_USD_PER_RUN:-5.0}
      - HARNESS_NTFY_URL=${HARNESS_NTFY_URL:-https://ntfy.sh}
      - HARNESS_NTFY_TOPIC=${HARNESS_NTFY_TOPIC:-}
      - HARNESS_PUBLIC_URL=${HARNESS_PUBLIC_URL:-}
    volumes:
      - ./data:/data
