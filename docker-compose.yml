services:
  harness:
    # Build your own, or use the published image:
    image: ghcr.io/dannymcc/harness:latest
    build: .
    container_name: harness
    restart: unless-stopped
    labels:
      # Opt-in for watchtower-style auto-updates; harmless otherwise.
      # Restarts drain first (SIGTERM: in-flight agent runs finish, nothing
      # new starts), and anything still cut off is requeued on boot. Give
      # watchtower a matching stop timeout (WATCHTOWER_TIMEOUT=30m).
      - "com.centurylinklabs.watchtower.enable=true"
    # How long Docker waits after SIGTERM before SIGKILL. Must be at least
    # HARNESS_DRAIN_TIMEOUT_S (default 25 min) or deploys kill agents mid-run.
    stop_grace_period: 30m
    ports:
      # Keep the GUI off the public internet: bind to loopback (and front it
      # with a tailnet/VPN or an authenticating reverse proxy).
      - "127.0.0.1:8300:8300"
    env_file: .env
    volumes:
      - ./data:/data
